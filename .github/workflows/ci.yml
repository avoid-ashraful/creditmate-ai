name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

# Action references use version tags because the runner has no verified offline SHA catalog.
# SUBMODULE_TOKEN: create a fine-grained read-only token with Contents: read on each private
# submodule repository, then add it as the repository secret SUBMODULE_TOKEN. Checkout uses
# it for recursive private-submodule fetches and falls back to GITHUB_TOKEN for public repos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  backend:
    name: Backend (${{ matrix.app }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [accounts, saved, reviews, alerts, credit_cards, banks, search, credit_mate_ai]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creditmate_81ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d creditmate_81ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: creditmate-ai-be
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-test-secret
      SEARCH_ENABLED: 'True'
      REDIS_CACHE_URL: redis://127.0.0.1:6379/14
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: creditmate_81ci
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/creditmate_81ci
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5 # tag used: no verified offline SHA catalog
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5 # tag used: no verified offline SHA catalog
      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Django checks and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Lint
        run: uv run flake8 .
      - name: Tests with coverage
        run: uv run pytest "$APP_TEST_PATH" --cov=. --cov-report=term-missing --cov-report=xml:reports/coverage.xml
        env:
          APP_TEST_PATH: ${{ matrix.app }}
      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --validate --file /tmp/schema.yml

  frontend:
    name: Frontend checks, tests, production build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4 # tag used: no verified offline SHA catalog
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: CI=true npx react-scripts test --watchAll=false --maxWorkers=2 --coverage
        name: Jest and coverage
      - run: npm run check-types
      - run: npm run check-lint
      - run: npm run check-format
      - run: npm run tokens:check
      - run: npm run build
      - run: npm run bundle:budget
      - uses: actions/upload-artifact@v4 # tag used: no verified offline SHA catalog
        with:
          name: frontend-production-build
          path: creditmate-ai-fe/build
          if-no-files-found: error
          retention-days: 2

  e2e:
    name: Playwright production e2e (non-visual)
    if: ${{ github.event_name != 'schedule' }}
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4 # tag used: no verified offline SHA catalog
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4 # tag used: no verified offline SHA catalog
        with:
          name: frontend-production-build
          path: creditmate-ai-fe/build
      - uses: actions/cache@v4 # tag used: no verified offline SHA catalog
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('creditmate-ai-fe/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Serve production build and run non-visual e2e
        run: |
          npx serve -s build -l 4173 > /tmp/creditmate-serve.log 2>&1 &
          echo $! > /tmp/creditmate-serve.pid
          npx wait-on http://127.0.0.1:4173
          npx playwright test --grep-invert '@visual|visual'
        env:
          BASE_URL: http://127.0.0.1:4173
      - if: always()
        run: if [ -f /tmp/creditmate-serve.pid ]; then kill "$(cat /tmp/creditmate-serve.pid)"; fi

  visual-regression:
    name: Playwright visual regression (optional)
    if: ${{ github.event_name != 'schedule' }}
    needs: frontend
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4 # tag used: no verified offline SHA catalog
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4 # tag used: no verified offline SHA catalog
        with:
          name: frontend-production-build
          path: creditmate-ai-fe/build
      - uses: actions/cache@v4 # tag used: no verified offline SHA catalog
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('creditmate-ai-fe/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: |
          npx serve -s build -l 4173 > /tmp/creditmate-serve.log 2>&1 &
          echo $! > /tmp/creditmate-serve.pid
          npx wait-on http://127.0.0.1:4173
          npx playwright test --grep '@visual|visual'
        env:
          BASE_URL: http://127.0.0.1:4173
      - if: always()
        run: if [ -f /tmp/creditmate-serve.pid ]; then kill "$(cat /tmp/creditmate-serve.pid)"; fi

  security-audit:
    name: npm audit (informational)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4 # tag used: no verified offline SHA catalog
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit and summarize without failing CI
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))' >> "$GITHUB_STEP_SUMMARY"

  storybook:
    name: Storybook production build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4 # tag used: no verified offline SHA catalog
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build-storybook

  infrastructure:
    name: Kubernetes and monitoring validation
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: azure/setup-kubectl@v4 # tag used: no verified offline SHA catalog
        with:
          version: v1.31.0
      - name: Install validators
        run: |
          curl -sSLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          sudo apt-get update && sudo apt-get install -y yamllint
          curl -sSLo /tmp/promtool.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz
          tar -xzf /tmp/promtool.tar.gz -C /tmp
          sudo install /tmp/prometheus-2.55.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Build and validate Kubernetes manifests
        run: |
          for dir in k8s/base k8s/overlays/staging k8s/overlays/production; do
            kustomize build "$dir" | kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: Lint YAML and validate Prometheus rules
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' k8s monitoring
          promtool check rules monitoring/prometheus/rules/*.yml
          promtool test rules monitoring/prometheus/tests/*.yml

  k6-smoke:
    name: Nightly k6 smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: grafana/setup-k6-action@v1 # tag used: no verified offline SHA catalog
      - name: Start stack and run smoke test
        run: |
          docker compose -f docker-compose.staging.yml up -d --wait
          k6 run load-tests/smoke.js
      - if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  container-build:
    name: Build images (tagged releases may publish)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - component: backend
            context: creditmate-ai-be
            image: ghcr.io/avoid-ashraful/creditmate-ai-backend
          - component: frontend
            context: creditmate-ai-fe
            image: ghcr.io/avoid-ashraful/creditmate-ai-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # tag used: no verified offline SHA catalog
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3 # tag used: no verified offline SHA catalog
      - name: Login to GHCR for version tags only
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3 # tag used: no verified offline SHA catalog
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push only for version tags)
        uses: docker/build-push-action@v6 # tag used: no verified offline SHA catalog
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ matrix.image }}:${{ github.ref_name }}
          build-args: REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL || secrets.REACT_APP_API_BASE_URL }}
          provenance: false
