name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
  # Nightly k6 schedule paused: it needs published images and a seeded stack (see load-tests/README.md).

# Core Actions are pinned to verified upstream release commits (reviewed 2026-10-20).
# SUBMODULE_TOKEN: create a fine-grained read-only token with Contents: read on each private
# submodule repository, then add it as the repository secret SUBMODULE_TOKEN. Checkout uses
# it for recursive private-submodule fetches and falls back to GITHUB_TOKEN for public repos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  backend:
    name: Backend (${{ matrix.app }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [accounts, saved, reviews, alerts, credit_cards, banks, search, credit_mate_ai, common, tests]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creditmate_81ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d creditmate_81ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: creditmate-ai-be
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-test-secret
      SEARCH_ENABLED: 'True'
      REDIS_CACHE_URL: redis://127.0.0.1:6379/14
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: creditmate_81ci
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/creditmate_81ci
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: creditmate-ai-be/.python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Django checks and migrations
        run: |
          uv run --frozen python manage.py check
          uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Enable pgvector in template1
        # Mirrors creditmate-ai-be .github/workflows/tests.yml (PR #39):
        # pytest runs with --nomigrations, so the retrieval migration that
        # creates the extension never executes and VectorField tables are
        # built straight from the models. Test databases are cloned from
        # template1, so the extension must exist there. The service image
        # ships the extension binaries but does not enable it.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Lint
        run: uv run --frozen flake8 .
      - name: Tests with coverage
        run: uv run --frozen pytest "$APP_TEST_PATH" --cov=. --cov-report=term-missing --cov-report=xml:reports/coverage.xml
        env:
          APP_TEST_PATH: ${{ matrix.app }}
      - name: Validate OpenAPI schema
        run: uv run --frozen python manage.py spectacular --validate --file /tmp/schema.yml

  frontend:
    name: Frontend checks, tests, production build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm test -- --watchAll=false --maxWorkers=2 --coverage
        name: Jest and coverage
      - run: npm run check-types
      - run: npm run check-lint
      - run: npm run check-format
      - run: npm run tokens:check
      - run: npm run build
      - run: npm run bundle:budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-production-build
          path: creditmate-ai-fe/build
          if-no-files-found: error
          retention-days: 2

  e2e:
    name: Playwright production e2e (non-visual)
    if: ${{ github.event_name != 'schedule' }}
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci
      - name: Build with mocked API base for e2e
        run: CI=true REACT_APP_API_BASE_URL=http://e2e.invalid/api/v1 REACT_APP_SITE_URL=http://127.0.0.1:4173 REACT_APP_ENABLE_API_LOGGING=false npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('creditmate-ai-fe/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Serve production build and run non-visual e2e
        run: npx playwright test --grep-invert '@visual|visual'
        env:
          E2E_PORT: '4173'

  visual-regression:
    name: Playwright visual regression (optional)
    if: ${{ github.event_name != 'schedule' }}
    needs: frontend
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci
      - name: Build with mocked API base for e2e
        run: CI=true REACT_APP_API_BASE_URL=http://e2e.invalid/api/v1 REACT_APP_SITE_URL=http://127.0.0.1:4173 REACT_APP_ENABLE_API_LOGGING=false npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('creditmate-ai-fe/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: |
          npx playwright test --grep '@visual|visual'
        env:
          E2E_PORT: '4173'

  security-audit:
    name: npm audit (informational)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci
      - name: Audit and summarize without failing CI
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))' >> "$GITHUB_STEP_SUMMARY"

  storybook:
    name: Storybook production build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: creditmate-ai-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: creditmate-ai-fe/package-lock.json
      - run: npm ci
      - run: npm run build-storybook

  infrastructure:
    name: Kubernetes and monitoring validation
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: azure/setup-kubectl@v5 # tag used: no verified offline SHA catalog
        with:
          version: v1.31.0
      - name: Install validators
        run: |
          curl -sSLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          sudo apt-get update && sudo apt-get install -y yamllint
          curl -sSLo /tmp/promtool.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz
          tar -xzf /tmp/promtool.tar.gz -C /tmp
          sudo install /tmp/prometheus-2.55.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Build and validate Kubernetes manifests
        run: |
          for dir in k8s/base k8s/overlays/staging k8s/overlays/production; do
            kustomize build "$dir" | kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: Lint YAML and validate Prometheus rules
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' k8s monitoring
          promtool check rules monitoring/prometheus/rules/*.yml
          promtool test rules monitoring/prometheus/tests/*.yml

  k6-smoke:
    name: k6 smoke (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: grafana/setup-k6-action@v1 # tag used: no verified offline SHA catalog
      - name: Start stack and run smoke test
        run: |
          docker compose -f docker-compose.staging.yml up -d --wait
          k6 run load-tests/smoke.js
      - if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  container-build:
    name: Build images (publish version tags only)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - component: backend
            context: creditmate-ai-be
            image: ghcr.io/avoid-ashraful/creditmate-ai-backend
          - component: frontend
            context: creditmate-ai-fe
            image: ghcr.io/avoid-ashraful/creditmate-ai-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4 # tag used: no verified offline SHA catalog
      - name: Login to GHCR for version tags only
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4 # tag used: no verified offline SHA catalog
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push only for version tags)
        uses: docker/build-push-action@v7 # tag used: no verified offline SHA catalog
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # Branch names can contain "/" (invalid in a Docker tag); only version tags use the ref name.
          tags: ${{ matrix.image }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
          # Untagged builds only prove the image builds; tagged releases must set the real URL (empty fails the build).
          build-args: REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL || secrets.REACT_APP_API_BASE_URL || (!startsWith(github.ref, 'refs/tags/') && 'https://api.example.invalid/api/v1' || '') }}
          provenance: false
