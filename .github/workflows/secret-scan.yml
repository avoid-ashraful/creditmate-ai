name: Secret scan (gitleaks)

# Scans for credentials committed to this repo with gitleaks.
# - pull_request: scans only the commits the PR adds (diff scan).
# - weekly schedule / manual: scans the full git history.
#
# The gitleaks BINARY is installed from a pinned, checksum-verified
# release tarball instead of using the gitleaks GitHub Action, whose
# licensing terms for organisation accounts are ambiguous; the binary is
# MIT-licensed and unambiguous. Findings are redacted in the logs and the
# job exits non-zero when a leak is found.
#
# Configuration (rules + verified false-positive allowlist) lives in
# .gitleaks.toml at the repo root.

on:
  pull_request:
    branches: [master, main]
  schedule:
    # Mondays 04:23 UTC (off the hour to spread GitHub-side load).
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks-pr:
    name: gitleaks (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the PR range scan needs both endpoint commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the PR's commits
        env:
          # Passed via env (not interpolated into the script) on purpose.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --config .gitleaks.toml --redact --log-opts="${BASE_SHA}...${HEAD_SHA}" .

  gitleaks-full:
    name: gitleaks (full history)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact .
