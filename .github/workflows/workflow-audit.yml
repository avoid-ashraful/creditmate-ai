name: Workflow audit (zizmor)

# Statically audits this repo's own GitHub Actions workflows for security
# problems (unpinned actions, credential persistence, cache poisoning,
# template injection, over-broad permissions, ...). Findings are emitted
# as PR annotations and fail the job.
#
# The gate is defined by .github/zizmor.yml: every workflow must be
# finding-free except three audits that are ignored for the pre-existing
# ci.yml only (its findings are documented follow-up work — SHA-pinning
# ci.yml, per-job credential tightening, cache isolation). Any other
# finding, in any workflow, fails this check.

on:
  pull_request:
    branches: [master, main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          config: .github/zizmor.yml
          # Pinned to the zizmor version this configuration was validated
          # against locally; bump deliberately.
          version: 1.32.0
          # Plain annotations + exit-code gate; no SARIF upload, so the
          # job needs no security-events permission.
          advanced-security: false
          annotations: true
