suite: rendered backend Secret (local mode only)
templates:
  - templates/secret.yaml
tests:
  - it: renders nothing by default (existingSecret / ExternalSecret modes)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Secret when secrets.create is on
    set:
      secrets.create: true
      secrets.data:
        SECRET_KEY: test-only-value
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: creditmate-backend-secrets
