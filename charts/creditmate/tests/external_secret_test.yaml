suite: ExternalSecret (staging/production secret mode)
templates:
  - templates/external-secret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret pointing at the configured store when enabled
    set:
      externalSecrets.enabled: true
      externalSecrets.clusterSecretStore: production-store
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ExternalSecret
      - equal:
          path: metadata.name
          value: creditmate-backend-secrets
      - equal:
          path: spec.secretStoreRef.name
          value: production-store
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: creditmate-backend-secrets
