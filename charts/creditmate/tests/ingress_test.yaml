suite: ingress and TLS
templates:
  - templates/ingress.yaml
tests:
  - it: terminates TLS with the configured secret and host by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.tls[0].secretName
          value: creditmate-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: creditmate.localhost
      - equal:
          path: spec.rules[0].host
          value: creditmate.localhost

  - it: routes /api and /admin to the backend and everything else to the frontend
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: creditmate-backend
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /admin
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[2].backend.service.name
          value: creditmate-frontend

  - it: points TLS and host at the environment values when overridden
    set:
      ingress.host: staging.creditmate.ai
      ingress.tlsSecretName: staging-tls
      ingress.clusterIssuer: letsencrypt-prod
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: staging-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: staging.creditmate.ai
      - equal:
          path: metadata.annotations
          value:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
            nginx.ingress.kubernetes.io/hsts: "true"
            nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
            nginx.ingress.kubernetes.io/limit-rps: "20"
            nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
            nginx.ingress.kubernetes.io/limit-connections: "20"
            nginx.ingress.kubernetes.io/proxy-body-size: 10m
            nginx.ingress.kubernetes.io/enable-modsecurity: "true"
            nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"

  - it: drops the ModSecurity annotations when modSecurity is disabled
    set:
      ingress.modSecurity: false
    asserts:
      - notEqual:
          path: metadata.annotations
          value:
            nginx.ingress.kubernetes.io/enable-modsecurity: "true"

  - it: renders nothing when the ingress is disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0
