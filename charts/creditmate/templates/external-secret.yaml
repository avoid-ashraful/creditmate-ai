{{- if .Values.externalSecrets.enabled }}
# Secrets pulled from the external store by External Secrets Operator.
# No secret values live in git; only the store reference and remote key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: creditmate-backend-secrets
  labels:
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecrets.clusterSecretStore must be set when externalSecrets.enabled=true" .Values.externalSecrets.clusterSecretStore }}
  target:
    name: creditmate-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.secretPath }}
{{- end }}
