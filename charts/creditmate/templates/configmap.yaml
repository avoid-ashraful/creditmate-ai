apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "creditmate.configName" . }}
  labels:
    {{- include "creditmate.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: "credit_mate_ai.settings"
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  CSRF_TRUSTED_ORIGINS: {{ .Values.config.csrfTrustedOrigins | quote }}
  DB_HOST: {{ include "creditmate.dbHost" . | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  REDIS_CACHE_URL: {{ printf "redis://%s:6379/%s" (include "creditmate.redisHost" .) .Values.config.redisCacheDb | quote }}
  CELERY_BROKER_URL: {{ printf "redis://%s:6379/%s" (include "creditmate.redisHost" .) .Values.config.celeryBrokerDb | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://%s:6379/%s" (include "creditmate.redisHost" .) .Values.config.celeryBrokerDb | quote }}
  SEARCH_ENABLED: {{ .Values.config.searchEnabled | quote }}
  SEARCH_URL: {{ .Values.config.searchUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_ALLOWED_IPS: {{ .Values.config.metricsAllowedIps | quote }}
  EVENT_STREAMING_ENABLED: {{ .Values.config.eventStreamingEnabled | quote }}
  VECTOR_SEARCH_ENABLED: {{ .Values.config.vectorSearchEnabled | quote }}
  ADVISOR_ENABLED: {{ .Values.config.advisorEnabled | quote }}
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
