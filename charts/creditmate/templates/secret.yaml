{{- if .Values.secrets.create }}
# LOCAL ONLY: rendered from values that must come from the git-ignored
# values-local-secrets.yaml (or the documented throwaway defaults in
# values-local.yaml). Staging/production use externalSecrets instead.
apiVersion: v1
kind: Secret
metadata:
  name: creditmate-backend-secrets
  labels:
    {{- include "creditmate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
