{{- if .Values.redis.enabled }}
# First-party LOCAL Redis (StatefulSet, appendonly persistence).
# Local/dev only — staging/production use a managed instance (enabled=false).
# No password locally: access is limited by NetworkPolicy to CreditMate pods.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "creditmate.redisName" . }}
  labels:
    app.kubernetes.io/name: {{ include "creditmate.redisName" . }}
    app.kubernetes.io/component: cache
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "creditmate.redisName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "creditmate.redisName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "creditmate.redisName" . }}
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: creditmate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.redis.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "creditmate.redisName" . }}
  labels:
    app.kubernetes.io/name: {{ include "creditmate.redisName" . }}
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "creditmate.redisName" . }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
