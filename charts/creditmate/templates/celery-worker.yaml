# Celery worker: same image as the backend. Scaled by KEDA on Redis queue
# length when keda.enabled (no CPU HPA is rendered for the worker then).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "creditmate.workerName" . }}
  labels:
    app.kubernetes.io/name: {{ include "creditmate.workerName" . }}
    app.kubernetes.io/component: worker
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.celery.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "creditmate.workerName" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "creditmate.workerName" . }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: creditmate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "creditmate.podSecurityContext" . | nindent 6 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /app/.venv/bin/celery
            - -A
            - credit_mate_ai
            - worker
            - --loglevel=INFO
            - {{ printf "--concurrency=%d" (int .Values.celery.worker.concurrency) }}
            - --max-tasks-per-child=500
          {{- include "creditmate.backendEnvFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.celery.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "/app/.venv/bin/celery -A credit_mate_ai inspect ping -d \"celery@$HOSTNAME\" --timeout 10"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          {{- include "creditmate.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
