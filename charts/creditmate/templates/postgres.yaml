{{- if .Values.postgres.enabled }}
# First-party LOCAL Postgres 17 + pgvector (StatefulSet, single instance).
# Local/dev only — staging/production use a managed instance (enabled=false).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "creditmate.postgresName" . }}
  labels:
    app.kubernetes.io/name: {{ include "creditmate.postgresName" . }}
    app.kubernetes.io/component: database
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "creditmate.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "creditmate.postgresName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "creditmate.postgresName" . }}
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: creditmate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.postgres.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "creditmate.postgresName" . }}
  labels:
    app.kubernetes.io/name: {{ include "creditmate.postgresName" . }}
    {{- include "creditmate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "creditmate.postgresName" . }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
