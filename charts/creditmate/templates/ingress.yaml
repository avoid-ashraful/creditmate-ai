{{- if .Values.ingress.enabled }}
# Public entry point (ingress-nginx). TLS from cert-manager.
# /api and /admin go to the backend; everything else to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creditmate-ingress
  labels:
    {{- include "creditmate.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimitRps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    {{- if .Values.ingress.modSecurity }}
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "creditmate.apiName" . }}
                port: { name: http }
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "creditmate.apiName" . }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "creditmate.frontendName" . }}
                port: { name: http }
{{- end }}
