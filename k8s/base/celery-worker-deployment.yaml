# Celery worker: same image as the backend, consuming the default queue.
# Liveness pings the worker over the broker; a stuck worker is restarted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditmate-celery-worker
  labels:
    app.kubernetes.io/name: creditmate-celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: creditmate-celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creditmate-celery-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: creditmate-celery-worker
      containers:
        - name: worker
          image: ghcr.io/avoid-ashraful/creditmate-ai-be:REPLACE_ME_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          # Warm shutdown on SIGTERM lets in-flight tasks finish within the grace period.
          command:
            - celery
            - -A
            - credit_mate_ai
            - worker
            - --loglevel=INFO
            - --concurrency=2
            - --max-tasks-per-child=500
          envFrom:
            - configMapRef:
                name: creditmate-config
            - secretRef:
                name: creditmate-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A credit_mate_ai inspect ping -d "celery@$HOSTNAME" --timeout 10
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
