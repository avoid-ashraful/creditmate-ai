# Horizontal Pod Autoscalers: scale on CPU > 70% or memory > 80% average utilization.
# Requires metrics-server in the cluster. Overlays set min/max bounds.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditmate-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: creditmate-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditmate-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: creditmate-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditmate-celery-worker
spec:
