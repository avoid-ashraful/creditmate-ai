# Pulls backend secrets from an external store (AWS Secrets Manager, Vault, etc.)
# via External Secrets Operator. No secret values live in git; only the store
# reference and the remote key path, which overlays override.
# Requires the external-secrets.io CRDs and a ClusterSecretStore to exist.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: creditmate-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REPLACE_ME_CLUSTER_SECRET_STORE
  target:
    name: creditmate-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: REPLACE_ME_SECRET_PATH
