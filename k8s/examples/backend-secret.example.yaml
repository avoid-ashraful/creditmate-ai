  DATABASE_PASSWORD: REPLACE_ME_DATABASE_PASSWORD
  REDIS_PASSWORD: REPLACE_ME_REDIS_PASSWORD
  ELASTICSEARCH_PASSWORD: REPLACE_ME_ELASTICSEARCH_PASSWORD
  SENTRY_DSN: REPLACE_ME_SENTRY_DSN
