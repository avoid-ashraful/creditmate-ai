apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production: creditmate.ai. Separate namespace, database, Redis and Elasticsearch
# from staging. Higher minimum replica counts so a single node loss never takes
# the site down. Image tags are set by the release pipeline, never by hand.
namespace: creditmate-prod

resources:
  - ../../base
  - namespace.yaml

images:
  - name: ghcr.io/avoid-ashraful/creditmate-ai-fe
    newTag: REPLACE_ME_IMAGE_TAG
  - name: ghcr.io/avoid-ashraful/creditmate-ai-be
    newTag: REPLACE_ME_IMAGE_TAG

patches:
  - target:
      kind: Ingress
      name: creditmate-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: creditmate.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: creditmate.ai
  - target:
      kind: ConfigMap
      name: creditmate-config
    patch: |-
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: creditmate.ai,www.creditmate.ai
      - op: replace
        path: /data/DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://creditmate.ai,https://www.creditmate.ai
      - op: replace
        path: /data/DATABASE_HOST
        value: REPLACE_ME_PROD_DB_HOST
      - op: replace
        path: /data/DATABASE_NAME
        value: REPLACE_ME_PROD_DB_NAME
      - op: replace
        path: /data/DATABASE_USER
        value: REPLACE_ME_PROD_DB_USER
      - op: replace
        path: /data/REDIS_URL
        value: redis://REPLACE_ME_PROD_REDIS_HOST:6379/0
      - op: replace
        path: /data/CELERY_BROKER_URL
        value: redis://REPLACE_ME_PROD_REDIS_HOST:6379/1
      - op: replace
        path: /data/ELASTICSEARCH_URL
        value: https://REPLACE_ME_PROD_ES_HOST:9200
  - target:
      kind: ExternalSecret
      name: creditmate-backend-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: creditmate/production/backend
  - target:
      kind: HorizontalPodAutoscaler
      name: creditmate-frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: HorizontalPodAutoscaler
      name: creditmate-backend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target:
      kind: HorizontalPodAutoscaler
      name: creditmate-celery-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8
