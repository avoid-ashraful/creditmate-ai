# Prometheus configuration for one environment (staging or production).
# Targets are static placeholders; in Kubernetes, replace them with kubernetes_sd_configs
# or the Prometheus Operator ServiceMonitors. Job names must stay "creditmate-*" so the
# CreditmateTargetDown alert covers them.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: REPLACE_ME_ENVIRONMENT  # staging | production

rule_files:
  - rules/creditmate-recording.yml
  - rules/creditmate-alerts.yml
  - rules/creditmate-data-quality.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - REPLACE_ME_ALERTMANAGER_HOST:9093

scrape_configs:
  - job_name: creditmate-backend            # django-prometheus on gunicorn
    metrics_path: /metrics
    static_configs:
      - targets: ["REPLACE_ME_BACKEND_HOST:8000"]

  - job_name: creditmate-frontend           # nginx-prometheus-exporter sidecar or host exporter
    static_configs:
      - targets: ["REPLACE_ME_FRONTEND_HOST:9113"]

  - job_name: creditmate-celery             # celery-exporter
    static_configs:
      - targets: ["REPLACE_ME_CELERY_EXPORTER_HOST:9808"]

  - job_name: creditmate-node               # node_exporter (USE metrics)
    static_configs:
      - targets: ["REPLACE_ME_NODE_HOST:9100"]

  - job_name: creditmate-kube-state         # kube-state-metrics (deployments, HPAs, pods)
    static_configs:
      - targets: ["REPLACE_ME_KSM_HOST:8080"]

  - job_name: creditmate-redis              # redis_exporter
    static_configs:
      - targets: ["REPLACE_ME_REDIS_EXPORTER_HOST:9121"]

  - job_name: creditmate-postgres           # postgres_exporter
    static_configs:
      - targets: ["REPLACE_ME_POSTGRES_EXPORTER_HOST:9187"]

  - job_name: creditmate-elasticsearch      # elasticsearch_exporter
    static_configs:
      - targets: ["REPLACE_ME_ES_EXPORTER_HOST:9114"]
